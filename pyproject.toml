[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tisca"
version = "2.0.0"
description = "TISCA v2 - Test-Informed Simulation Count Algorithm (Python reference implementation)"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["tisca/python"]
